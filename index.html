<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Tennis Watch</title>
<style>
:root{
  --bg:#0e1116; --card:#161b22; --line:#262d38; --text:#e6e9ef; --muted:#8b95a5; --accent:#7ee787;
  --mto:#ff6b6b; --ret:#e5484d; --wd:#ff9f43; --inj:#f5d547; --brk:#5fa8ff;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:18px 16px 60px}
header h1{margin:0;font-size:22px;letter-spacing:.2px}
header p{margin:4px 0 0;color:var(--muted);font-size:13px}
.controls{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 8px;align-items:center}
.chip{background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer}
.chip.on{background:var(--accent);color:#0b1f10;border-color:var(--accent);font-weight:600}
input[type=search]{flex:1;min-width:160px;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:14px}
label.tog{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:13px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:26px 0 10px}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.pcard b{display:block;font-size:14px}
.pcard small{color:var(--muted)}
.badge{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:2px 7px;color:#10141a;margin-right:6px}
.item{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--muted);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.item h3{margin:6px 0 4px;font-size:15px;font-weight:600}
.item h3 a{color:var(--text);text-decoration:none}
.item h3 a:hover{text-decoration:underline}
.meta{color:var(--muted);font-size:12.5px;display:flex;flex-wrap:wrap;gap:4px 10px}
.conf-high{color:var(--accent)} .conf-medium{color:var(--inj)} .conf-low{color:var(--muted)}
.snip{color:var(--muted);font-size:13px;margin:4px 0 0}
.empty,.warn{color:var(--muted);background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:16px;font-size:14px}
.warn{margin-top:20px;font-size:12.5px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Tennis Watch</h1>
    <p id="sub">Injuries, MTOs, withdrawals and breaks, pulled from news feeds.</p>
  </header>

  <div class="controls" id="chips"></div>
  <div class="controls">
    <input type="search" id="q" placeholder="Search player or headline">
    <label class="tog"><input type="checkbox" id="hideLow" checked> Hide low confidence</label>
  </div>

  <h2>Player status (last 14 days)</h2>
  <div class="board" id="board"></div>

  <h2>Latest events</h2>
  <div id="list"></div>

  <div id="feeds"></div>
</div>

<script>
const COLORS = {MTO:"var(--mto)",Retirement:"var(--ret)",Withdrawal:"var(--wd)",Injury:"var(--inj)",Break:"var(--brk)"};
const TYPES = ["All","MTO","Retirement","Withdrawal","Injury","Break"];
const state = {type:"All", q:"", hideLow:true, events:[], feeds:[], generated:null};

const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safeUrl = u => /^https?:\/\//i.test(u || "") ? u : "#";

function ago(iso){
  const s = Math.max(0, (Date.now() - new Date(iso).getTime()) / 1000);
  if (s < 90) return "just now";
  const m = s / 60; if (m < 60) return Math.round(m) + "m ago";
  const h = m / 60; if (h < 48) return Math.round(h) + "h ago";
  return Math.round(h / 24) + "d ago";
}

function badge(type){
  return '<span class="badge" style="background:' + (COLORS[type] || "var(--muted)") + '">' + esc(type) + '</span>';
}

function visible(){
  const q = state.q.trim().toLowerCase();
  return state.events.filter(e => {
    if (state.hideLow && e.confidence === "low") return false;
    if (state.type !== "All" && e.type !== state.type) return false;
    if (q && !(e.player + " " + e.headline + " " + e.reason).toLowerCase().includes(q)) return false;
    return true;
  });
}

function renderChips(){
  const box = document.getElementById("chips");
  box.innerHTML = TYPES.map(t => '<button class="chip' + (t === state.type ? " on" : "") + '" data-t="' + t + '">' + t + '</button>').join("");
  box.querySelectorAll("button").forEach(b => b.onclick = () => { state.type = b.dataset.t; render(); });
}

function renderBoard(){
  const cutoff = Date.now() - 14 * 86400000;
  const map = new Map();
  for (const e of state.events){
    if (e.player === "Unknown") continue;
    if (state.hideLow && e.confidence === "low") continue;
    if (new Date(e.published).getTime() < cutoff) continue;
    const k = e.player.toLowerCase();
    if (!map.has(k)) map.set(k, {latest: e, count: 1}); else map.get(k).count++;
  }
  const rows = [...map.values()].slice(0, 18);
  document.getElementById("board").innerHTML = rows.length ? rows.map(r => {
    const e = r.latest;
    return '<div class="pcard"><b>' + esc(e.player) + '</b>' + badge(e.type) +
      '<small>' + (e.reason ? esc(e.reason) + " · " : "") + ago(e.published) + (r.count > 1 ? " · " + r.count + " reports" : "") + '</small></div>';
  }).join("") : '<div class="empty">No players flagged yet.</div>';
}

function renderList(){
  const list = visible().slice(0, 150);
  document.getElementById("list").innerHTML = list.length ? list.map(e => {
    const n = (e.sources || []).length;
    return '<div class="item" style="border-left-color:' + (COLORS[e.type] || "var(--muted)") + '">' +
      badge(e.type) + '<b>' + esc(e.player) + '</b>' + (e.reason ? ' <span class="meta" style="display:inline">· ' + esc(e.reason) + '</span>' : '') +
      '<h3><a href="' + esc(safeUrl(e.url)) + '" target="_blank" rel="noopener noreferrer">' + esc(e.headline) + '</a></h3>' +
      (e.snippet ? '<p class="snip">' + esc(e.snippet) + '</p>' : '') +
      '<div class="meta"><span>' + ago(e.published) + '</span><span>' + esc((e.sources || []).slice(0, 3).join(", ")) + (n > 3 ? " +" + (n - 3) : "") + '</span>' +
      (n > 1 ? '<span>' + n + ' sources</span>' : '') +
      '<span class="conf-' + esc(e.confidence) + '">' + esc(e.confidence) + ' confidence</span></div></div>';
  }).join("") : '<div class="empty">Nothing here yet. If you just set this up, open the Actions tab on GitHub and run the "Fetch tennis news" workflow once.</div>';
}

function renderHeader(){
  const latest = state.events.length ? state.events.reduce((a, b) => a.found_at > b.found_at ? a : b).found_at : null;
  document.getElementById("sub").textContent = latest
    ? "Latest event found " + ago(latest) + ". Player names are guessed by keywords, so check the headline."
    : "Injuries, MTOs, withdrawals and breaks, pulled from news feeds.";
}

function renderFeeds(){
  const bad = state.feeds.filter(f => !f.ok);
  document.getElementById("feeds").innerHTML = bad.length
    ? '<div class="warn">Some feeds are failing: ' + bad.map(f => esc(f.name)).join(", ") + '. The rest still work.</div>' : "";
}

function render(){ renderChips(); renderHeader(); renderBoard(); renderList(); renderFeeds(); }

async function load(){
  try{
    const e = await fetch("data/events.json?t=" + Date.now()).then(r => r.json());
    state.events = e.events || [];
    const s = await fetch("data/status.json?t=" + Date.now()).then(r => r.json()).catch(() => ({feeds: []}));
    state.feeds = s.feeds || [];
  }catch(err){
    document.getElementById("list").innerHTML = '<div class="empty">Could not load data. Open this page from your published site, not from the file on your computer.</div>';
    return;
  }
  render();
}

document.getElementById("q").addEventListener("input", ev => { state.q = ev.target.value; renderList(); });
document.getElementById("hideLow").addEventListener("change", ev => { state.hideLow = ev.target.checked; render(); });
renderChips();
load();
setInterval(load, 5 * 60 * 1000);
</script>
</body>
</html>
